name: Build Windows binaries
on:
  push:
    branches: ['**', '!appveyor-*', '!freebsd-*', '!pr-review*']
    paths-ignore: ['.github/workflows/crg.yml', 'CRG_STATUS.md', 'docs/**', 'scripts/crg/gui_smoke.py']
  workflow_dispatch:
permissions:
  contents: read
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CXX: ccache g++
  CC: ccache gcc
jobs:
  build-win32:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtkmm3
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-zeromq
            mingw-w64-ucrt-x86_64-cppzmq
            mingw-w64-ucrt-x86_64-glm
            mingw-w64-ucrt-x86_64-libgit2
            mingw-w64-ucrt-x86_64-podofo
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-opencascade
            git
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: crg-win32-ccache-v1-${{ github.sha }}
          restore-keys: crg-win32-ccache-v1-
      - name: Build native editor and tools
        run: |
          ccache --max-size=1G
          meson setup build --buildtype=debugoptimized
          python scripts/crg/compile_probe.py build
          meson compile -C build -j 4 horizon-eda horizon-imp horizon-crg horizon-crg-native horizon-crg-tests
      - name: CRG analysis and native round trip
        run: |
          mkdir -p acceptance
          ./build/horizon-crg-tests.exe examples/crg/demo/blocks.json examples/crg/demo/pool
          ./build/horizon-crg.exe examples/crg/demo/blocks.json examples/crg/demo/pool acceptance/demo
          ./build/horizon-crg-native.exe examples/crg/demo/blocks.json examples/crg/demo/pool acceptance/roundtrip
      - name: Package Windows runtime dependencies and validate isolated execution
        run: python scripts/crg/package_windows.py "$(cygpath -m "$MINGW_PREFIX")"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horizon-crg-windows-${{ github.sha }}
          path: |
            dist/*.zip
            acceptance/
            build/meson-logs/meson-log.txt
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .ccache
          key: crg-win32-ccache-v1-${{ github.sha }}
