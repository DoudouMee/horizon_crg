name: Build Windows binaries

on:
  push:
    branches:
      - '**'
      - '!appveyor-*'
      - '!freebsd-*'
      - '!pr-review*'
    tags: [ '*' ]
  pull_request:
    branches: [ master ]

jobs:
  build-win32:
    runs-on: windows-latest
    steps:
    - name: Check tag
      if: startsWith(github.ref, 'refs/tags/')
      run: echo "Building tag ${{ github.ref }}"
    - uses: actions/checkout@v3
    - uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-gtkmm3
          mingw-w64-x86_64-sqlite3
          mingw-w64-x86_64-zeromq
          mingw-w64-x86_64-cppzmq
          mingw-w64-x86_64-glm
          mingw-w64-x86_64-libgit2-winhttp
          mingw-w64-x86_64-podofo
          mingw-w64-x86_64-libarchive
          mingw-w64-x86_64-curl-winssl
          mingw-w64-x86_64-jq
          mingw-w64-x86_64-meson
          mingw-w64-x86_64-cmake
          zip
          unzip
          make
          git
          dos2unix
          rsync
    - name: Install Opencascade lite
      shell: msys2 {0}
      run: |
        wget https://github.com/carrotIndustries/mingw-opencascade-lite/releases/download/v7.8.1-1/mingw-w64-x86_64-opencascade-lite-7.8.1-1-any.pkg.tar.zst
        pacman -U mingw-w64-x86_64-opencascade-lite-7.8.1-1-any.pkg.tar.zst --noconfirm
    - name: Build
      shell: msys2 {0}
      run: |
        meson setup build
        meson compile -C build
    - name: CRG acceptance tests
      if: startsWith(github.ref, 'refs/heads/crg/')
      shell: msys2 {0}
      run: |
        meson compile -C build horizon-crg-tests
        ./build/horizon-crg-tests.exe examples/crg/demo/blocks.json examples/crg/demo/pool
        mkdir -p acceptance
        ./build/horizon-crg.exe examples/crg/demo/blocks.json examples/crg/demo/pool acceptance/demo
        ./build/horizon-crg-native.exe examples/crg/demo/blocks.json examples/crg/demo/pool acceptance/roundtrip
    - name: Make dist
      shell: msys2 {0}
      run: ./make_bindist.sh
    - name: Add CRG examples and tools
      if: startsWith(github.ref, 'refs/heads/crg/')
      shell: msys2 {0}
      run: |
        cp build/horizon-crg.exe build/horizon-crg-native.exe dist/horizon/bin/
        mkdir -p dist/horizon/examples
        cp -a examples/crg/demo dist/horizon/examples/
        cp docs/crg.md dist/horizon/README-CRG.md
        cp scripts/crg/open-demo.bat dist/horizon/
        cd dist
        zip -r horizon-crg-windows.zip horizon
    - name: Check for missing DLLs
      shell: msys2 {0}
      run: ./check_dll.sh
    - name: set artifact name
      shell: msys2 {0}
      run: echo "artifact_name=horizon-win64-$(date +%Y-%m-%d-%H%M)-$(echo ${{ github.ref_name }} | tr / -)" >> $GITHUB_ENV
    - name: deploy to selfnet mirror
      if: github.repository_owner == 'horizon-eda' && github.event_name != 'pull_request'
      shell: msys2 {0}
      run: |
        RSYNC_PASSWORD=${{ secrets.RSYNC_PASSWORD }} rsync -avz --stats dist/*.zip rsync://horizon-eda@mirror-1.server.selfnet.de/horizon-eda/win64-ci/${{ env.artifact_name }}.zip
        echo "::notice title=Download this build::Get the zip archive from the selfnet mirror: https://mirror.selfnet.de/horizon-eda/win64-ci/${{ env.artifact_name }}.zip"
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ env.artifact_name }}
        path: dist/*.zip
    - name: Build MSI
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/win32-installer'
      run: |
        $env:PATH += ";$($Env:WIX)\bin"
        cd wix
        .\install.bat
    - uses: actions/upload-artifact@v4
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/win32-installer'
      with:
        name: horizon-win64-installer
        path: wix/*.msi
